# The virtual card: sd2psXtd's PS1 card code, stock and with Super MemCard, and the phase 1 sync. Started by hand
# (Actions → Virtual card tests), not on every push: the private repo's Actions minutes are limited. The same tests run
# locally: make -C sim/card test, sh sim/bus/run.sh.
name: Virtual card tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sd2psXtd
        run: sim/card/get-firmware.sh
      - name: Stock firmware
        run: make -C sim/card -s && sim/card/build/test_card
      - name: With Super MemCard
        run: make -C sim/card -s SMC=1 && SYNC_LOG=1 sim/card/build-smc/test_card   # with the sync log, to see why one fails
      - name: With Super MemCard, AddressSanitizer
        run: make -C sim/card -s SMC=1 SAN=address B=build-smc-asan && sim/card/build-smc-asan/test_card
      - name: Bus simulation (the front-port driver against the virtual card), with Super MemCard and stock
        run: |
          sudo apt-get install -y -q iverilog >/dev/null
          sh sim/bus/run.sh
          STOCK=1 sh sim/bus/run.sh
      - name: Bus simulation, phase 2 (the card driver every game core's sys_top carries, at a game core's clock)
        run: SMC_SYS=1 CLK_MHZ=42.95 sh sim/bus/run.sh

  firmware:
    # the real card firmware with Super MemCard, built for the RP2040 (GUI included) as sd2psXtd's own CI does
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib >/dev/null
      - name: Build SD2PSX (with the screen)
        run: firmware/build.sh SD2PSX
      - name: Build PMC+ (no screen)
        run: firmware/build.sh PMC+
