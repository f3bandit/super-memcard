# Builds console cores with our patches (patches/sys, patches/<core>) on top of the pinned
# upstream commit, with Quartus 17.0.2 Lite (the image MiSTer's own builds use). Started by hand
# (Actions → Build cores → core name or "all") or by the upstream watcher for a moved core.
# Big cores (N64, Saturn, PSX) take hours; a private repo's Actions minutes are limited.
name: Build cores

on:
  workflow_dispatch:
    inputs:
      core:
        description: 'Core to build (e.g. PSX), or "all"'
        required: true
        default: all
      card_driver:
        description: 'Add the Super MemCard card driver to sys_top (phase 2); "no" builds the core as upstream has it, to compare'
        required: false
        default: 'yes'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(tools/cores.sh matrix '${{ inputs.core }}')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned upstream core
        run: git submodule update --init --depth 1 "cores/${{ matrix.core }}"
      - name: Apply our patches
        run: tools/cores.sh patch "${{ matrix.core }}"
        env:
          SMC_SYS: ${{ inputs.card_driver == 'no' && '0' || '1' }}
      - name: Compile with Quartus
        working-directory: cores/${{ matrix.core }}
        run: |
          # a full core can fail to route on one fitter seed and fit on another: up to three seeds
          for seed in 1 2 3; do
            [ "$seed" = 1 ] || { sudo chown -R "$(id -u):$(id -g)" .; echo "set_global_assignment -name SEED $seed" >> "${{ matrix.project }}.qsf"; echo "::warning::${{ matrix.core }}: fitter seed $seed"; }
            docker run --rm -v "$PWD":/project -w /project theypsilon/quartus-lite-c5:17.0.2.docker0 \
              /opt/intelFPGA_lite/quartus/bin/quartus_sh --flow compile "${{ matrix.project }}.qpf" && ok=1 && break || ok=0
          done
          [ "$ok" = 1 ]
          sudo chown -R "$(id -u):$(id -g)" .
          pin=$(git rev-parse --short HEAD)
          tag=$([ "${{ inputs.card_driver }}" = no ] && echo "_upstream" || true)
          cp "output_files/${{ matrix.project }}.rbf" "../../${{ matrix.core }}_${pin}_$(date -u +%Y%m%d)${tag}.rbf"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.core }}
          path: |
            ${{ matrix.core }}_*.rbf
            cores/${{ matrix.core }}/output_files/*.summary
